<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dashboard flow mock — palette, strip, dock</title>
  <style>
    :root { --bg: #1a1d21; --panel: #252a30; --border: #3a424c; --fg: #e8eaed; --accent: #7eb8da; --danger: #d36b5c; font-family: system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh; }
    .bar { display: flex; gap: .75rem; padding: .75rem 1rem; border-bottom: 1px solid var(--border); align-items: center; }
    .strip { margin: .75rem 1rem; padding: .75rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
    .dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); max-height: 40vh; overflow: auto; padding: .75rem 1rem; }
    .palette { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: start center; padding-top: 12vh; }
    .palette > div { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; }
    input { width: 100%; padding: .5rem; margin-bottom: .75rem; background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; }
    button { margin-right: .5rem; padding: .35rem .75rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    button.primary { border-color: var(--accent); }
    button.danger { border-color: var(--danger); color: var(--danger); }
    .hint { opacity: .75; font-size: .85rem; margin-top: .5rem; }
  </style>
</head>
<body>
  <div class="bar"><strong>AgentDecompile</strong> <span class="hint">⌘K palette · context strip · jobs dock</span></div>
  <div class="strip">
    <strong>Ghidra bulk</strong>
    <button class="primary">Run</button>
    <button>Fields…</button>
    <button>Close</button>
    <p class="hint">program, repo, db prefilled from selection — expand to override out-dir</p>
  </div>
  <div class="dock">
    <strong>Jobs</strong> <span class="hint">A finished job is not a match.</span>
    <ul><li><code>a1b2</code> corpus.ghidra-bulk — running · Cancel</li></ul>
  </div>
  <div class="palette" hidden id="p">
    <div><input placeholder="Actions, surfaces, jobs…" /><p class="hint">Mock only — see live /dashboard after ce-work U1–U3.</p></div>
  </div>
</body>
</html>
